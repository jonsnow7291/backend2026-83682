spring.profiles.active=dev
# Variables locales (SMTP, etc.) desde .env en la raiz del proyecto, si existe (no versionado)
spring.config.import=optional:file:.env[.properties]
# Seguridad JWT (cambiar en produccion; minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:clinica-veterinaria-secreto-jwt-2026-uniminuto}
app.jwt.expiration-minutes=480

# Carga masiva
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger: /clinica/v1/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.groups-order=ASC
springdoc.swagger-ui.tags-sorter=alpha

# Correo (SMTP de Brevo). Usuario y clave por variables de entorno: MAIL_USERNAME / MAIL_PASSWORD
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Segundo factor (OTP por correo): usuarios que lo exigen y remitente verificado en Brevo
app.otp.usuarios=${OTP_USUARIOS:jchaparro}
app.mail.remitente=${MAIL_REMITENTE:}
