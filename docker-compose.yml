services:
  db:
    image: mysql:8.4
    container_name: clinica-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: clinica
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - clinica-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clinica-data:
