services:
  db:
    image: mysql:8.4
    container_name: clinica-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: clinica
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - clinica-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # 127.0.0.1 (TCP) y no localhost (socket): durante la inicialización la imagen levanta un servidor temporal
      # sin red que respondería al ping y haría arrancar el backend antes de tiempo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p12345"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: clinica-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "12345"
      JWT_SECRET: "clinica-veterinaria-secreto-jwt-2026-uniminuto"
      # SMTP (Brevo): las credenciales viven en el archivo .env (no versionado)
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_REMITENTE: "${MAIL_REMITENTE:-}"
      OTP_USUARIOS: ""
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    # Por defecto se construye desde el repositorio del frontend en GitHub (basta clonar solo este repo).
    # Con los dos repos clonados lado a lado:  FRONTEND_CONTEXT=../frontend26-83682 docker compose up --build
    build: "${FRONTEND_CONTEXT:-https://github.com/jonsnow7291/frontend26-83682.git#1016004-JDCHAPARRO}"
    container_name: clinica-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  clinica-data:
